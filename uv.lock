    { name = "boto3" },
    { name = "confluent-kafka" },
    { name = "fastapi" },
    { name = "opentelemetry-api" },
    { name = "opentelemetry-exporter-otlp-proto-http" },
    { name = "opentelemetry-sdk" },
    { name = "protobuf" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pydantic-settings" },
    { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [
    { name = "boto3-stubs", extra = ["dynamodb", "kafka", "rds", "s3", "sqs"] },
    { name = "grpcio-tools" },
    { name = "httpx" },
    { name = "mypy" },
    { name = "pymilvus", extra = ["milvus-lite"] },
    { name = "pytest" },
    { name = "ruff" },
    { name = "types-protobuf" },
]

[package.metadata]
requires-dist = [
    { name = "boto3", specifier = ">=1.35,<2" },
    { name = "confluent-kafka", specifier = ">=2.6,<3" },
    { name = "fastapi", specifier = ">=0.115,<1" },
    { name = "opentelemetry-api", specifier = ">=1.30,<2" },
    { name = "opentelemetry-exporter-otlp-proto-http", specifier = ">=1.30,<2" },
    { name = "opentelemetry-sdk", specifier = ">=1.30,<2" },
    { name = "protobuf", specifier = ">=6.33,<8" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2,<4" },
    { name = "pydantic-settings", specifier = ">=2.8,<3" },
    { name = "uvicorn", specifier = ">=0.34,<1" },
]

[package.metadata.requires-dev]
dev = [
    { name = "boto3-stubs", extras = ["dynamodb", "kafka", "rds", "s3", "sqs"], specifier = ">=1.35,<2" },
    { name = "grpcio-tools", specifier = ">=1.75,<2" },
    { name = "httpx", specifier = ">=0.28,<1" },
    { name = "mypy", specifier = ">=1.15,<2" },
    { name = "pymilvus", extras = ["milvus-lite"], specifier = ">=2.5,<3" },
    { name = "pytest", specifier = ">=8.3,<10" },
    { name = "ruff", specifier = ">=0.12,<1" },
    { name = "types-protobuf", specifier = ">=6,<8" },
]

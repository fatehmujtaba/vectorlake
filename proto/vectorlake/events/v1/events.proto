syntax = "proto3";

package vectorlake.events.v1;

message EventContext {
  string event_id = 1;
  string image_id = 2;
  string tenant_id = 3;
  string dedup_scope_id = 4;
  int64 occurred_at_epoch_ms = 5;
  string traceparent = 6;
  uint32 schema_version = 7;
  string event_type = 8;
}

message ImageReceivedV1 {
  EventContext context = 1;
  string bucket = 2;
  string object_key = 3;
  string object_version = 4;
  uint64 size_bytes = 5;
  string upload_intent_id = 6;
}

message ImageDuplicateV1 {
  enum DuplicateClass {
    DUPLICATE_CLASS_UNSPECIFIED = 0;
    EXACT = 1;
    PIXEL = 2;
    DERIVED = 3;
  }

  EventContext context = 1;
  string duplicate_group_id = 2;
  string representative_image_id = 3;
  DuplicateClass duplicate_class = 4;
  string policy_version = 5;
  string decision_record_id = 6;
}

message ImageInferenceReadyV1 {
  EventContext context = 1;
  string duplicate_group_id = 2;
  string bucket = 3;
  string object_key = 4;
  string model_route = 5;
}

message EmbeddingGeneratedV1 {
  EventContext context = 1;
  string embedding_id = 2;
  string duplicate_group_id = 3;
  string model_name = 4;
  string model_version = 5;
  string preprocess_version = 6;
  repeated float vector = 7;
  uint32 dimension = 8;
  string vector_ref = 9;
}

message EmbeddingArchivedV1 {
  EventContext context = 1;
  string embedding_id = 2;
  string archive_bucket = 3;
  string archive_key = 4;
  int64 archived_at_epoch_ms = 5;
}

message ImageIndexedV1 {
  EventContext context = 1;
  string embedding_id = 2;
  string collection_name = 3;
  int64 indexed_at_epoch_ms = 4;
}

message ProcessingFailedV1 {
  EventContext context = 1;
  string stage = 2;
  string error_code = 3;
  bool retryable = 4;
  string safe_public_message = 5;
}

[project]
name = "vectorlake"
version = "0.1.0"
description = "Image ingestion, deduplication, embedding, and visual search platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "confluent-kafka>=2.6,<3",
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic-settings>=2.8,<3",
    "protobuf>=6.33,<8",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,kafka,rds,s3,sqs]>=1.35,<2",
    "grpcio-tools>=1.75,<2",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pymilvus[milvus-lite]>=2.5,<3",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "types-protobuf>=6,<8",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorlake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/vectorlake/events/v1/events_pb2.py", "src/vectorlake/events/v1/events_pb2.pyi"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "vectorlake.events.v1.events_pb2"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["pymilvus", "pymilvus.*"]
ignore_missing_imports = true
